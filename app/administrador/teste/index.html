<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Optare · Administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* ============== OPTARE TOKENS ============== */
  :root {
    --bg: #0a0a0a;
    --bg-2: #111111;
    --bg-3: #181818;
    --card: #141414;
    --card-2: #1a1a1a;
    --border: #2a2a2a;
    --border-2: #3a3a3a;
    --fg: #f5f5f5;
    --fg-2: #d4d4d4;
    --muted: #8a8a8a;
    --muted-2: #5a5a5a;
    --primary: oklch(0.516 0.20 28);
    --primary-2: oklch(0.46 0.18 28);
    --primary-soft: oklch(0.516 0.20 28 / 0.12);
    --primary-fg: #ffffff;
    --success: #16a34a;
    --warn: #d97706;
    --info: #2563eb;
    --shadow: 5px 5px 0 0 rgba(0,0,0,1);
    --shadow-sm: 3px 3px 0 0 rgba(0,0,0,1);
    --radius: 0px;
    --font: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  .light {
    --bg: #e8e7e3;
    --bg-2: #ddddd8;
    --bg-3: #d2d2cd;
    --card: #ededea;
    --card-2: #e3e3df;
    --border: #1a1a1a;
    --border-2: #2a2a2a;
    --fg: #0a0a0a;
    --fg-2: #1a1a1a;
    --muted: #4a4a4a;
    --muted-2: #6a6a6a;
    --primary: oklch(0.446 0.168 27);
    --primary-2: oklch(0.40 0.15 27);
    --primary-soft: oklch(0.446 0.168 27 / 0.12);
    --shadow: 3px 3px 0 0 rgba(0,0,0,1);
    --shadow-sm: 3px 3px 0 0 rgba(0,0,0,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { font-family: var(--font); background: var(--bg); color: var(--fg); letter-spacing: -0.01em; min-height: 100vh; }
  body { font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--primary); color: white; }

  /* Scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: var(--bg); }
  *::-webkit-scrollbar-thumb { background: var(--border); border: 2px solid var(--bg); }
  *::-webkit-scrollbar-thumb:hover { background: var(--border-2); }

  /* Utility classes used widely */
  .label-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .label-eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--primary); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-size: 13px; font-weight: 500; transition: transform .08s, box-shadow .08s; }
  .btn:hover { background: var(--card-2); }
  .btn-primary { background: var(--primary); color: var(--primary-fg); border: 1px solid var(--primary); padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--primary-2); transform: translate(-1px,-1px); box-shadow: 4px 4px 0 0 #000; }
  .btn-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 #000; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); padding: 9px 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--fg); }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
  .input { width: 100%; background: var(--bg-2); border: 1px solid var(--border); padding: 10px 12px; color: var(--fg); font-size: 13px; }
  .input:focus { outline: none; border-color: var(--primary); }
  .input::placeholder { color: var(--muted-2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--border); font-size: 11px; color: var(--muted); }
  .chip.red { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .chip.green { border-color: var(--success); color: var(--success); }
  .chip.warn { border-color: var(--warn); color: var(--warn); }
  .chip.solid-red { background: var(--primary); color: white; border-color: var(--primary); }
  .card { background: var(--card); border: 1px solid var(--border); }
  .card-pop { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }

  /* Toast */
  .toast-stack { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
  .toast { background: #0a0a0a; color: #fff; border: 1px solid var(--primary); border-left-width: 4px; padding: 12px 16px; font-size: 12px; min-width: 260px; box-shadow: 4px 4px 0 0 #000; animation: toastIn .2s ease-out; }
  @keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Empty state */
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border-2); }

  /* Inputs com ícone interno — evita sobreposição */
  .input-with-icon { padding-left: 34px !important; }
  .input-with-kbd { padding-right: 52px !important; }

  /* Tabela rolável horizontalmente em telas pequenas */
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 720px; }

  /* Mobile menu button (hidden em desktop) */
  .mobile-menu-btn { display: none; }
  .mobile-overlay { display: none; }

  /* ============ TABLET + MOBILE: ≤1080px ============ */
  @media (max-width: 1080px) {
    body { font-size: 13px; }

    /* Sidebar vira drawer off-canvas */
    .app-sidebar {
      position: fixed !important;
      top: 0; left: 0;
      transform: translateX(-100%);
      transition: transform .25s ease;
      z-index: 200;
      width: 260px !important;
    }
    .app-sidebar.open { transform: translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,0.6); }
    .mobile-overlay {
      display: block;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 150;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .mobile-overlay.open { opacity: 1; pointer-events: auto; }

    /* Mobile menu button visible */
    .mobile-menu-btn { display: inline-flex !important; }

    /* Topbar reflow */
    .app-topbar {
      padding: 12px 14px !important;
      flex-wrap: wrap;
      gap: 10px !important;
    }
    .app-topbar h1 { font-size: 15px !important; }
    .topbar-search {
      order: 10;
      width: 100% !important;
      flex-basis: 100%;
    }
    .topbar-search .kbd-hint { display: none; }
    .topbar-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .topbar-newbtn-label { display: none; }
    .app-topbar .btn-icon-only { padding: 7px !important; }
    .app-topbar .btn-primary { padding-left: 10px !important; padding-right: 10px !important; flex-shrink: 0; }

    /* Grids colapsam */
    .grid-stat-4 { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
    .grid-stat-4 .card-pop { padding: 14px !important; }
    .grid-2col { grid-template-columns: 1fr !important; }
    .grid-2-1 { grid-template-columns: 1fr !important; }
    .grid-cards { grid-template-columns: 1fr !important; gap: 12px !important; }
    .grid-cards-sm { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }

    /* Page padding menor */
    .page-pad { padding: 16px 14px !important; }

    /* Detail panel ocupa tela toda */
    .detail-panel { width: 100% !important; max-width: 100% !important; }
    .detail-panel-inner { padding: 16px !important; }

    /* E-mails: 3 painéis viram navegação stacked */
    .email-shell { flex-direction: column; height: auto !important; }
    .email-folders {
      width: 100% !important;
      flex-direction: row !important;
      overflow-x: auto;
      gap: 4px !important;
      padding: 10px !important;
      border-right: none !important;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .email-folders .folder-labels-section { display: none; }
    .email-folders button { flex-shrink: 0; white-space: nowrap; }
    .email-folders .compose-btn { display: none; }
    .email-list, .email-reader {
      width: 100% !important;
      border-right: none !important;
    }
    /* Quando um e-mail é selecionado em mobile, esconde a lista */
    .email-shell.has-selected .email-list { display: none; }
    .email-shell:not(.has-selected) .email-reader { display: none; }
    .email-back-btn { display: inline-flex !important; }

    /* Composer responsivo */
    .composer { right: 0 !important; left: 0 !important; bottom: 0 !important; width: 100% !important; max-width: 100% !important; height: 80vh !important; }

    /* Filtros tabs com scroll horizontal */
    .filter-row { overflow-x: auto; flex-wrap: nowrap !important; padding-bottom: 4px; }
    .filter-row > button { flex-shrink: 0; }

    /* Toast menor */
    .toast-stack { right: 10px; left: 10px; }
    .toast { min-width: 0 !important; }

    /* Esconder coisas em mobile */
    .hide-mobile { display: none !important; }
  }

  .email-back-btn { display: none; }

  /* Toque grande em todos os botões pequenos no mobile (exceto toggles e ícones) */
  @media (max-width: 1080px) {
    button:not(.no-min):not([style*="height:"]) { min-height: 36px; }
    .input { padding: 12px 14px; font-size: 14px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Tweak defaults persisted by host -->
  <script>
    window.__TWEAKS__ = /*EDITMODE-BEGIN*/{
      "theme": "dark",
      "accent": "#D40C24",
      "density": "spacious",
      "sidebarStyle": "collapsed"
    }/*EDITMODE-END*/;
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="page-dashboard.jsx"></script>
  <script type="text/babel" src="page-projetos.jsx"></script>
  <script type="text/babel" src="page-produtos.jsx"></script>
  <script type="text/babel" src="page-emails.jsx"></script>
  <script type="text/babel" src="page-propostas.jsx"></script>
  <script type="text/babel" src="page-outras.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPTARE Engenharia Em Breve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <style>
    /* ─────────────────────────────────────────────
       TOKENS — extraídos diretamente do globals.css
       ───────────────────────────────────────────── */
    :root {
      --bg:        oklch(0.1157 0 0);
      --fg:        oklch(0.9389 0 0);
      --primary:   oklch(0.5164 0.2011 28.1378);
      --primary-d: oklch(0.4463 0.1678 27.4784);
      --accent:    oklch(0.3956 0.142 26.6897);
      --muted:     oklch(0.2156 0 0);
      --border:    oklch(0.3705 0 0);
      --card:      oklch(0.1579 0 0);

      --font-mono: "JetBrains Mono", monospace;
      --font-display: "Bebas Neue", sans-serif;

      /* sombra brutalista — mesmo padrão do globals */
      --shadow-brutal: 5px 5px 0px 1px hsl(0 0% 0% / 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ─── GRID DE FUNDO ─────────────────────────── */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(oklch(0.3705 0 0 / 0.15) 1px, transparent 1px),
        linear-gradient(90deg, oklch(0.3705 0 0 / 0.15) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── VINHETA ───────────────────────────────── */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 70% 70% at 50% 50%,
        transparent 40%,
        oklch(0.06 0 0 / 0.85) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ─── BRILHO PRIMÁRIO (glow central) ────────── */
    .glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        oklch(0.4463 0.1678 27.4784 / 0.12) 0%,
        transparent 70%
      );
      pointer-events: none;
      z-index: 0;
      animation: pulse-glow 6s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ─── PARTÍCULAS ────────────────────────────── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--primary);
      border-radius: 0;
      opacity: 0;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0%   { opacity: 0;    transform: translateY(0)    scaleX(1); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { opacity: 0;    transform: translateY(-100vh) scaleX(1); }
    }

    /* ─── LINHAS DECORATIVAS ────────────────────── */
    .deco-line {
      position: fixed;
      background: linear-gradient(
        90deg,
        transparent,
        var(--primary),
        transparent
      );
      height: 1px;
      width: 100%;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .deco-line.top    { top: 15%; animation: scan 8s ease-in-out infinite; }
    .deco-line.bottom { bottom: 15%; animation: scan 8s ease-in-out infinite 4s; }

    @keyframes scan {
      0%, 100% { opacity: 0.1; transform: scaleX(0.3); }
      50%       { opacity: 0.35; transform: scaleX(1); }
    }

    /* ─── CONTAINER PRINCIPAL ───────────────────── */
    .main {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 2.5rem;
      animation: fade-in 1.2s ease forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── LOGO ──────────────────────────────────── */
    .logo-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: logo-in 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }

    @keyframes logo-in {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: -12px;
      border: 1px solid oklch(0.3705 0 0 / 0.6);
      animation: border-flicker 4s ease-in-out infinite;
    }

    @keyframes border-flicker {
      0%, 100% { border-color: oklch(0.3705 0 0 / 0.6); }
      50%       { border-color: oklch(0.4463 0.1678 27.4784 / 0.5); }
    }

    .logo-wrap img {
      height: 100px;
      width: auto;
      display: block;
      filter: drop-shadow(0 0 18px oklch(0.4463 0.1678 27.4784 / 0.5));
    }

    /* ─── DIVIDER ───────────────────────────────── */
    .divider {
      width: 280px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--primary),
        var(--accent),
        transparent
      );
      animation: divider-in 1s ease 0.6s both;
    }

    @keyframes divider-in {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }

    /* ─── BADGE STATUS ──────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--primary);
      animation: badge-in 0.8s ease 0.8s both;
      box-shadow: var(--shadow-brutal);
    }

    @keyframes badge-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--primary);
      border-radius: 0;
      animation: blink 1.4s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ─── MENSAGEM PRINCIPAL ────────────────────── */
    .message-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      animation: msg-in 1s ease 1s both;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .main-title {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--fg);
      text-shadow: 0 0 40px oklch(0.5164 0.2011 28.1378 / 0.3);
    }

    .main-title span {
      color: var(--primary);
    }

    .sub-text {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      color: oklch(0.5982 0 0);
      max-width: 400px;
      line-height: 1.7;
    }

    /* ─── BARRA DE PROGRESSO DECORATIVA ─────────── */
    .progress-bar {
      width: 280px;
      height: 3px;
      background: var(--muted);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-brutal);
    }

    .progress-bar::after {
      content: "";
      position: absolute;
      left: -60%;
      top: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        var(--primary),
        var(--accent)
      );
      animation: progress-sweep 2.4s ease-in-out infinite;
    }

    @keyframes progress-sweep {
      0%   { left: -60%; }
      100% { left: 110%; }
    }

    /* ─── SERVIÇOS (rodapé discreto) ────────────── */
    .services {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      max-width: 520px;
      animation: svc-in 1s ease 1.3s both;
    }

    @keyframes svc-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .svc-tag {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: oklch(0.4184 0 0);
      padding: 0.25rem 0.6rem;
      border: 1px solid oklch(0.3705 0 0 / 0.4);
      transition: color 0.25s, border-color 0.25s;
    }

    .svc-tag:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    /* ─── RODAPÉ ────────────────────────────────── */
    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: oklch(0.3705 0 0);
      text-transform: uppercase;
      z-index: 10;
      animation: footer-in 1s ease 1.6s both;
    }

    @keyframes footer-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ─── RESPONSIVO ────────────────────────────── */
    @media (max-width: 480px) {
      .logo-wrap img { height: 72px; }
      .divider, .progress-bar { width: 200px; }
      .services { gap: 0.4rem; }
    }
  </style>
</head>

  <script>
    // Gera partículas flutuantes dinamicamente
    const container = document.getElementById("particles");
    const COUNT = 28;

    for (let i = 0; i < COUNT; i++) {
      const p = document.createElement("div");
      p.className = "particle";

      // Posição horizontal aleatória
      p.style.left = Math.random() * 100 + "vw";
      // Tamanho ligeiramente variável
      const size = Math.random() > 0.7 ? 3 : 2;
      p.style.width = size + "px";
      p.style.height = size + "px";
      // Cada partícula começa em posição vertical aleatória
      p.style.bottom = Math.random() * 100 + "vh";
      // Duração e delay aleatórios para parecer orgânico
      const duration = 8 + Math.random() * 14;
      const delay    = Math.random() * 12;
      p.style.animationDuration  = duration + "s";
      p.style.animationDelay     = "-" + delay + "s"; // começa no meio do ciclo
      // Opacidade máxima variável
      p.style.opacity = (0.2 + Math.random() * 0.5).toString();

      container.appendChild(p);
    }
  </script>
